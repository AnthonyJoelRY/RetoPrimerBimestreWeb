{% extends 'layouts/base-fullscreen.html' %}

{% block title %}Registrar mi tienda{% endblock %}

{% block content %}
  <div class="portal-public-wrap ">
    <div class="portal-public-card">
  <h1>Registra tu tienda</h1>
  <p class="subtitle">Compra a mayoristas cerca de ti en pocos pasos</p>

  <form method="post">
    {% csrf_token %}
    {{ formulario.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Registrar mi tienda</button>
    </div>
  </form>

  <a href="{% url 'portal_login_tienda' %}" class="portal-public-back">&larr; Ya tengo cuenta</a>
    </div>
  </div>
{% endblock %}
