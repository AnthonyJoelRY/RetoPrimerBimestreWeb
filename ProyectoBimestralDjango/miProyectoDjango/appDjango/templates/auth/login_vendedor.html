{% extends 'layouts/base-fullscreen.html' %}
{% load static %}

{% block title %}Acceso Vendedor{% endblock %}

{% block content %}
  <div class="portal-public-wrap ">
    <div class="portal-public-card">
  <img src="{% static 'imagenes/logos_1.png' %}" alt="ISBEN Solution" style="width: 120px; margin-bottom: 12px;">
  <h1>Acceso Vendedor</h1>
  <p class="subtitle">Ingresa con la cuenta que te creó tu mayorista</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    {% csrf_token %}
    <p>
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required>
    </p>
    <p>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
    </p>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Ingresar</button>
    </div>
  </form>

  <a href="{% url 'portal_landing' %}" class="portal-public-back">&larr; Volver</a>
    </div>
  </div>
{% endblock %}
