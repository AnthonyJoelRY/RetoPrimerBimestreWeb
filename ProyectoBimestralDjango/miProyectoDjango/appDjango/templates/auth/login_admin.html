{% extends 'layouts/base-fullscreen.html' %}
{% load static %}

{% block title %}Administración ISBEN Solution{% endblock %}

{% block content %}
  <div class="portal-public-wrap portal-public-dark">
    <div class="portal-public-card">
  <img src="{% static 'imagenes/logos_1.png' %}" alt="ISBEN Solution" style="width: 120px; margin-bottom: 12px;">
  <h1>Administración ISBEN Solution</h1>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    {% csrf_token %}
    {{ formulario.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Acceder</button>
    </div>
  </form>

  <a href="{% url 'portal_landing' %}" class="portal-public-back">&larr; Volver</a>
    </div>
  </div>
{% endblock %}
