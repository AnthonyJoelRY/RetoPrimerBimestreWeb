{% extends 'base.html' %}

{% block title %}Detalle Pago{% endblock %}

{% block content %}
      <h1>Detalle de Pago</h1>
    <div class="detail-card">
<table>
      <tr><th>Pedido</th><td>{{ pago.pedido.id }}</td></tr><tr><th>Método</th><td>{{ pago.get_metodo_display }}</td></tr><tr><th>Monto</th><td>{{ pago.monto }}</td></tr><tr><th>Estado</th><td>{{ pago.get_estado_display }}</td></tr>
    </table>
    </div>
    <a href="{% url 'listar_pagos' %}" class="btn btn-outline back-link">&larr; Volver al listado</a>

  
{% endblock %}
