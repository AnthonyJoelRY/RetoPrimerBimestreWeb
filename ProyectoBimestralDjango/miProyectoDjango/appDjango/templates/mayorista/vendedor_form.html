{% extends 'layouts/base.html' %}

{% block title %}Nuevo Vendedor{% endblock %}

{% block content %}
  <div class="mb-4">
    <h1 class="h4 mb-0">Nuevo Vendedor</h1>
    <p class="text-muted mb-0">Perfil general (catálogo completo) o especializado (un producto asignado).</p>
  </div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ formulario.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Crear Vendedor</button>
        <a href="{% url 'portal_mayorista_vendedores' %}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
{% endblock %}
