{% extends 'layouts/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
  <div class="mb-4">
    <h1 class="h4 mb-0">{{ titulo }}</h1>
    <p class="text-muted mb-0">La foto y el precio son obligatorios.</p>
  </div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ formulario.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar Producto</button>
        <a href="{% url 'portal_mayorista_productos' %}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
{% endblock %}
