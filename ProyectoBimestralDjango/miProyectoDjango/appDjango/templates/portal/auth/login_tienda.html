{% extends 'portal/auth/_base_public.html' %}

{% block title %}Ingreso a tu Tienda{% endblock %}

{% block public_content %}
  <h1>Ingreso a tu Tienda</h1>
  <p class="subtitle">¿No tienes cuenta? <a href="{% url 'portal_registro_tienda' %}">Regístrate aquí</a></p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    {% csrf_token %}
    {{ formulario.as_p }}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Ingresar a mi Tienda</button>
    </div>
  </form>

  <a href="{% url 'portal_landing' %}" class="portal-public-back">&larr; Volver</a>
{% endblock %}
