{% extends 'portal/auth/_base_public.html' %}

{% block title %}Acceso Mayorista{% endblock %}

{% block public_content %}
  <h1>Acceso Mayorista</h1>
  <p class="subtitle">¿No tienes cuenta? <a href="{% url 'portal_registro_mayorista' %}">Regístrate aquí</a></p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    {% csrf_token %}
    <p>
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required>
    </p>
    <p>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
    </p>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Ingresar al Panel</button>
    </div>
  </form>

  <a href="{% url 'portal_landing' %}" class="portal-public-back">&larr; Volver</a>
{% endblock %}
