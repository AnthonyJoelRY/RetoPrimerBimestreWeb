{% extends 'portal/_base.html' %}

{% block title %}{% block page_title %}Vendedor{% endblock %} · MayorApp{% endblock %}

{% block body %}
  <div class="portal-mobile-shell">
    <header class="portal-topbar">
      <span class="portal-topbar-brand">MayorApp <small>Vendedor</small></span>
      <a href="{% url 'portal_logout' %}" class="portal-topbar-logout">&larr; Cerrar sesión</a>
    </header>

    <div class="portal-mobile-content">
      {% block page_content %}{% endblock %}
    </div>

    <nav class="portal-bottomnav">
      <a href="{% url 'portal_vendedor_dashboard' %}" class="{% if request.resolver_match.url_name == 'portal_vendedor_dashboard' %}active{% endif %}">
        <span class="portal-bottomnav-icon">&#9638;</span>Inicio
      </a>
      <a href="{% url 'portal_vendedor_pedido_paso1' %}" class="{% if 'pedido' in request.resolver_match.url_name %}active{% endif %}">
        <span class="portal-bottomnav-icon">&#43;</span>Pedido
      </a>
      <a href="{% url 'portal_vendedor_cobros' %}" class="{% if 'cobro' in request.resolver_match.url_name %}active{% endif %}">
        <span class="portal-bottomnav-icon">&#128179;</span>Cobros
      </a>
      <a href="{% url 'portal_vendedor_rendicion' %}" class="{% if request.resolver_match.url_name == 'portal_vendedor_rendicion' %}active{% endif %}">
        <span class="portal-bottomnav-icon">&#128196;</span>Rendir
      </a>
      <a href="{% url 'portal_logout' %}">
        <span class="portal-bottomnav-icon">&#8594;</span>Salir
      </a>
    </nav>
  </div>
{% endblock %}
