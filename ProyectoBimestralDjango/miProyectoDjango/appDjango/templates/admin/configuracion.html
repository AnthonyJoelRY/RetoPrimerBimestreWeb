{% extends 'layouts/base.html' %}

{% block title %}Configuración{% endblock %}

{% block content %}
  <div class="mb-4">
    <h1 class="h4 mb-0">Configuración Comercial</h1>
    <p class="text-muted mb-0">Ajusta los precios y comisiones de los planes ofrecidos a mayoristas.</p>
  </div>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ formulario.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
      </div>
    </form>
  </div>
{% endblock %}
