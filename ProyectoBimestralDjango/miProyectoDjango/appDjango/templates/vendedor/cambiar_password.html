{% extends 'layouts/base.html' %}

{% block title %}Cambiar Contraseña{% endblock %}

{% block content %}
  <h2>Cambia tu contraseña</h2>
  <p style="color:hsl(var(--muted-foreground)); font-size:13px;">Es tu primer ingreso: define una nueva contraseña para continuar.</p>

  <div class="form-card">
    <form method="post">
      {% csrf_token %}
      {{ formulario.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
{% endblock %}
